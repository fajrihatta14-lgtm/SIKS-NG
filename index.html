<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIKS-NG | Masuk ke Sistem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#122A4D;
    --navy-deep:#0B1D38;
    --blue:#1B4FD8;
    --teal:#12897E;
    --teal-deep:#0E6F66;
    --bg-mint:#D8F3EE;
    --bg-blue:#E1EEFB;
    --ink:#1E293B;
    --ink-soft:#64748B;
    --line:#E2E8F0;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg, var(--bg-mint) 0%, #EAF3F1 35%, var(--bg-blue) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    color:var(--ink);
  }
  a{color:inherit;}

  .card{
    width:100%;
    max-width:460px;
    background:var(--white);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(18,42,77,0.10);
    padding:44px 44px 36px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:16px;
    justify-content:center;
    margin-bottom:28px;
  }
  .brand-icon{
    width:64px;height:64px;
    border-radius:14px;
    background:#F4F7FB;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-icon svg{width:30px;height:30px;color:var(--navy);}
  .brand-divider{width:1px;height:44px;background:var(--line);}
  .brand-text-name{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:26px;
    color:var(--navy);
    line-height:1.1;
  }
  .brand-text-sub{
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--ink-soft);
    font-weight:600;
    margin-top:2px;
  }

  .headline{
    text-align:center;
    margin-bottom:28px;
  }
  .headline h1{
    font-family:'Poppins',sans-serif;
    font-size:23px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .headline p{
    margin:0;
    font-size:14px;
    color:var(--ink-soft);
  }

  .field{margin-bottom:20px;}
  .field-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .field-head label{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .field-head a{
    font-size:13px;
    font-weight:600;
    color:var(--blue);
    text-decoration:none;
  }
  .field-head a:hover{text-decoration:underline;}

  .input-wrap{position:relative;}
  .input-wrap input{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--white);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(27,79,216,0.12);
  }
  .input-wrap.has-icon input{padding-right:44px;}
  .eye-toggle{
    position:absolute;
    right:14px;top:50%;
    transform:translateY(-50%);
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    padding:4px;
  }
  .eye-toggle svg{width:18px;height:18px;}

  .captcha-box{
    background:#F7FAFC;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:22px;
  }
  .captcha-code-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:12px;
  }
  .captcha-code{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.35em;
    color:var(--blue);
    user-select:none;
  }
  .captcha-refresh{
    background:none;border:none;cursor:pointer;
    color:var(--blue);
    display:flex;align-items:center;justify-content:center;
    padding:6px;
    transition:transform .3s ease;
  }
  .captcha-refresh:hover{transform:rotate(90deg);}
  .captcha-refresh svg{width:20px;height:20px;}
  .captcha-box input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--white);
  }
  .captcha-box input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(27,79,216,0.12);
  }

  .error-msg{
    display:none;
    align-items:flex-start;
    gap:8px;
    background:#FDF1F1;
    border:1px solid #F3C6C6;
    color:#B3261E;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:18px;
    line-height:1.5;
  }
  .error-msg.show{display:flex;}

  .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:11px;
    background:var(--navy);
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary svg{width:17px;height:17px;}

  .divider{
    display:flex;align-items:center;gap:14px;
    margin:22px 0;
    color:#94A3B8;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.08em;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .btn-secondary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:11px;
    background:var(--teal);
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-secondary:hover{background:var(--teal-deep);}
  .btn-secondary:active{transform:translateY(1px);}
  .btn-secondary svg{width:17px;height:17px;}

  .helper-text{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin:26px 0 0;
  }
  .helper-text a{color:var(--blue);font-weight:600;text-decoration:none;}
  .helper-text a:hover{text-decoration:underline;}

  .footer-note{
    display:flex;align-items:center;gap:14px;
    margin-top:22px;
    color:#94A3B8;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.1em;
  }
  .footer-note::before,.footer-note::after{content:"";flex:1;height:1px;background:var(--line);}

  @media (max-width:520px){
    .card{padding:32px 24px 28px;}
  }
</style>
</head>
<body>

<div class="card">

  <div class="brand-row">
    <div class="brand-icon">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m5-4.13a4 4 0 100-8 4 4 0 000 8zm6 5c0-2.21-2.686-4-6-4s-6 1.79-6 4"/>
      </svg>
    </div>
    <div class="brand-divider"></div>
    <div>
      <div class="brand-text-name">SIKS-NG</div>
      <div class="brand-text-sub">NEXT GENERATION</div>
    </div>
  </div>

  <div class="headline">
    <h1>Selamat Datang Kembali</h1>
    <p>Silakan masuk ke akun Anda</p>
  </div>

  <div class="error-msg" id="errorMsg">
    <span>Username, kata sandi, atau kode verifikasi salah. Silakan periksa kembali.</span>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <div class="field-head">
        <label for="username">Username</label>
      </div>
      <div class="input-wrap">
        <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <div class="field-head">
        <label for="password">Kata Sandi</label>
        <a href="lupa-sandi.html">Lupa sandi?</a>
      </div>
      <div class="input-wrap has-icon">
        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
        <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Tampilkan kata sandi">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="eyeIcon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="captcha-box">
      <div class="captcha-code-row">
        <span class="captcha-code" id="captchaCode">87KB2</span>
        <button type="button" class="captcha-refresh" id="captchaRefresh" aria-label="Muat ulang kode">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 0113-5.1M19.5 12a7.5 7.5 0 01-13 5.1M18.5 4v3.5H15M5.5 20v-3.5H9"/>
          </svg>
        </button>
      </div>
      <input type="text" id="captchaInput" placeholder="Ketik kode di atas" autocomplete="off" required>
    </div>

    <button type="submit" class="btn-primary">
      Masuk
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l4-4m0 0l-4-4m4 4H3m8-9h5a3 3 0 013 3v12a3 3 0 01-3 3h-5"/></svg>
    </button>
  </form>

  <div class="divider">ATAU</div>

  <button type="button" class="btn-secondary" id="gisBtn">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
    Masuk ke SIKS-GIS
  </button>

  <p class="helper-text">Butuh bantuan teknis? <a href="#">Hubungi Bantuan</a></p>

  <div class="footer-note">KEMENTERIAN SOSIAL RI</div>
</div>

<script>
  // Simple captcha generator — demo only, not real spam protection.
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function generateCaptcha(){
    var code = '';
    for(var i=0;i<5;i++){
      code += chars.charAt(Math.floor(Math.random()*chars.length));
    }
    document.getElementById('captchaCode').textContent = code;
  }

  document.getElementById('captchaRefresh').addEventListener('click', function(){
    generateCaptcha();
    document.getElementById('captchaInput').value = '';
  });

  document.getElementById('eyeToggle').addEventListener('click', function(){
    var pass = document.getElementById('password');
    var isHidden = pass.type === 'password';
    pass.type = isHidden ? 'text' : 'password';
  });

  document.getElementById('gisBtn').addEventListener('click', function(){
    alert('Modul SIKS-GIS belum tersedia pada simulasi ini.');
  });

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var user = document.getElementById('username').value.trim();
    var pass = document.getElementById('password').value.trim();
    var captchaInput = document.getElementById('captchaInput').value.trim().toUpperCase();
    var captchaCode = document.getElementById('captchaCode').textContent;
    var errorBox = document.getElementById('errorMsg');

    if(user === '' || pass === '' || captchaInput !== captchaCode){
      errorBox.classList.add('show');
      generateCaptcha();
      document.getElementById('captchaInput').value = '';
      return;
    }
    errorBox.classList.remove('show');
    window.location.href = 'verifikasi.html';
  });
</script>
</body>
</html>
